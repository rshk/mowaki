[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
license = "BSD-3-Clause"
readme = "README.md"
authors = [
    { name = "Samuele Santi", email = "samuele@samuelesanti.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "click>=8.4.2",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "publicsuffixlist>=1.0.2.20260815",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "ua-parser[regex]>=1.0.2",
    "webauthn>=3.0.0",
]
classifiers = [
    "Private :: Do Not Upload"
]

[project.scripts]
app-cli = "app.svc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipython>=9.16.1",
    "pdbpp>=0.12.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "sphinx>=9.1.0",
    "sphinx-autobuild>=2025.8.25",
]
